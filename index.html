        <div class="snowbank" aria-hidden="true"></div>

        <script>
            (function () {
                const canvas = document.getElementById('snow');
                const ctx = canvas.getContext('2d');
                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
                let flakes = [];
                let width = 0;
                let height = 0;
                let frameId = null;

                // wind gusts: every 8-16s the wind ramps up, blows for 2-4s, then dies down
                let wind = 0;
                let windTarget = 0;
                let gustFrames = 0;
                let calmFrames = 300;

                function updateWind() {
                    if (gustFrames > 0) {
                        if (--gustFrames <= 0) {
                            windTarget = 0;
                            calmFrames = Math.round(480 + Math.random() * 480);
                        }
                    } else if (--calmFrames <= 0) {
                        const dir = Math.random() < 0.5 ? -1 : 1;
                        windTarget = dir * (1.5 + Math.random() * 1.5);
                        gustFrames = Math.round(120 + Math.random() * 120);
                    }
                    wind += (windTarget - wind) * 0.02;
                }

                function resize() {
                    const ratio = window.devicePixelRatio || 1;
                    width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width * ratio;
                    canvas.height = height * ratio;
                    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

                    // density scales with screen area
                    const count = Math.min(110, Math.round((width * height) / 14000));
                    flakes = Array.from({ length: count }, () => makeFlake(true));
                    if (reduceMotion.matches) draw();
                }

                function makeFlake(anywhere) {
                    const r = Math.random() * 7 + 3; // arm length in px
                    return {
                        x: Math.random() * width,
                        y: anywhere ? Math.random() * height : -r,
                        r: r,
                        speed: r * 0.07 + Math.random() * 0.3,
                        hue: Math.random() < 0.5 ? '125, 196, 232' : '150, 175, 200',
                        drift: Math.random() * Math.PI * 2,
                        angle: Math.random() * Math.PI,
                        spin: (Math.random() - 0.5) * 0.01,
                        alpha: Math.random() * 0.45 + 0.35
                    };
                }

                // six-armed flake: each arm has a pair of side branches
                function drawFlake(f) {
                    ctx.save();
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.angle);
                    ctx.strokeStyle = `rgba(${f.hue}, ${f.alpha})`;
                    ctx.lineWidth = Math.max(0.8, f.r / 7);
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        ctx.moveTo(0, 0);
                        ctx.lineTo(0, -f.r);
                        if (f.r > 4) {
                            const b = f.r * 0.55;
                            const len = f.r * 0.35;
                            ctx.moveTo(0, -b);
                            ctx.lineTo(-len * 0.7, -b - len * 0.7);
                            ctx.moveTo(0, -b);
                            ctx.lineTo(len * 0.7, -b - len * 0.7);
                        }
                        ctx.rotate(Math.PI / 3);
                    }
                    ctx.stroke();
                    ctx.restore();
                }

                function draw() {
                    ctx.clearRect(0, 0, width, height);
                    for (const f of flakes) drawFlake(f);
                }

                function step() {
                    updateWind();
                    for (let i = 0; i < flakes.length; i++) {
                        const f = flakes[i];
                        f.drift += 0.01;
                        f.angle += f.spin + wind * 0.004;
                        f.y += f.speed;
                        // bigger flakes catch more wind
                        f.x += Math.sin(f.drift) * 0.3 + wind * (0.5 + f.r / 10);
                        if (f.y > height + f.r) flakes[i] = makeFlake(false);
                        if (f.x > width + f.r) f.x = -f.r;
                        if (f.x < -f.r) f.x = width + f.r;
                    }
                    draw();
                    frameId = requestAnimationFrame(step);
                }

                function start() {
                    cancelAnimationFrame(frameId);
                    if (reduceMotion.matches) {
                        draw();
                    } else {
                        frameId = requestAnimationFrame(step);
                    }
                }

                window.addEventListener('resize', resize);
                reduceMotion.addEventListener('change', start);
                resize();
                start();
            })();
        </script>
    </body>
</html>
